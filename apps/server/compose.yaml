# 로컬 실행(architecture.md 6-3). 저장소 루트에서:
#   docker compose -f apps/server/compose.yaml up --build -d --wait db api
#   curl localhost:8080/healthz
#   curl -H 'x-ready-token: local-ready-token-0000' localhost:8080/readyz
# DB는 Postgres 17 하나로 대신한다(이 Mac에 supabase CLI가 없음 — B2에서 Auth·Storage가 필요해지면
# `pnpm dlx supabase start`로 바꾼다. B0-B1-report.md 참고). prisma/local/00-roles.sql이 Supabase의 롤 관계
# (마이그레이션·런타임 = 비슈퍼유저 prisma 롤, Data API 롤 anon·authenticated)를 흉내 낸다.
# api는 운영 이미지 그대로(NODE_ENV=production) — 운영 필수값(hops·READY_TOKEN)을 로컬 값으로 준다.
# 여기 비밀번호·토큰은 로컬 전용 고정값이다(운영 값 아님).
# B6a DB TLS: 운영 이미지는 DB CA가 없으면 부팅을 거부한다(env.ts). 이 compose는 그 규칙을 끄지 않고 **실제로 통과**한다 —
#   `certs`가 이 compose 전용 CA(CN 'mong compose local-only CA')와 `db` 서버 인증서를 볼륨에 만들고, db는 TLS를 켜고,
#   api는 DATABASE_CA_FILE로 그 CA만 믿는 verify-full로 붙는다. 운영은 Secret Manager의 Supabase CA만(`deploy.sh check`가 고정).
# 호스트 포트는 MONG_DB_PORT·MONG_API_PORT로 바꿀 수 있다(기본 54329·8080 — 다른 compose와 함께 띄울 때만 바꾼다).
name: mong

services:
  # 로컬 전용 CA + db 서버 인증서(SAN DNS:db). 볼륨에 이미 있으면 그대로. 키는 이 볼륨 밖으로 나가지 않는다
  certs:
    image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    entrypoint:
      - sh
      - -ec
      - |
        cd /tls
        if [ ! -s server.crt ]; then
          apk add --no-cache openssl >/dev/null
          openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj '/CN=mong compose local-only CA' -keyout ca.key -out ca.crt 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -subj '/CN=db' -keyout server.key -out server.csr 2>/dev/null
          printf 'subjectAltName=DNS:db\nextendedKeyUsage=serverAuth\nbasicConstraints=CA:FALSE\n' > ext
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 30 -extfile ext -out server.crt 2>/dev/null
          rm -f ca.key server.csr ext ca.srl
        fi
        chown 70:70 server.key server.crt && chmod 600 server.key && chmod 644 ca.crt server.crt
    volumes:
      - db-tls:/tls

  db:
    image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    environment:
      POSTGRES_USER: mong
      POSTGRES_PASSWORD: mong-local
      POSTGRES_DB: mong
    command: ['postgres', '-c', 'ssl=on', '-c', 'ssl_cert_file=/tls/server.crt', '-c', 'ssl_key_file=/tls/server.key']
    ports: ['127.0.0.1:${MONG_DB_PORT:-54329}:5432']
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-tls:/tls:ro
      - ./prisma/local/00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    healthcheck:
      # TCP로 확인한다 — 초기화 SQL을 돌리는 임시 서버는 유닉스 소켓만 열어서, 소켓 확인은 init 도중에 healthy가 된다
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U mong -d mong']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 120s
    depends_on:
      certs: { condition: service_completed_successfully }

  # 한 번 돌고 끝나는 마이그레이션(컨테이너 시작 때 마이그레이션하지 않는다는 원칙 — api와 분리)
  migrate:
    build: { context: ../.., dockerfile: apps/server/Dockerfile, target: build }
    environment:
      DIRECT_URL: postgresql://prisma:prisma-local@db:5432/mong
    command: ['pnpm', '--filter', 'server', 'exec', 'prisma', 'migrate', 'deploy']
    depends_on:
      db: { condition: service_healthy }

  api:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
      args: { APP_VERSION: local-compose }
    image: mong-api:local
    environment:
      DATABASE_URL: postgresql://prisma:prisma-local@db:5432/mong
      LOG_LEVEL: info
      OPENAPI_UI: 'true'
      # 로컬은 프록시가 없지만 운영 필수값이라 1로 둔다(XFF가 없으면 소켓 주소로 떨어진다)
      TRUSTED_PROXY_HOPS_API: '1'
      TRUSTED_PROXY_HOPS_WEB: '2'
      READY_TOKEN: local-ready-token-0000
      # B2 운영 필수값의 로컬 자리(이 compose에는 Supabase Auth가 없다 → JWT는 모두 401, 인증 없는 경로만 스모크한다)
      SUPABASE_URL: https://supabase.invalid
      SUPABASE_SERVICE_ROLE_KEY: local-service-role-key-not-secret
      RECOVERY_PEPPER: local-recovery-pepper-not-secret-000000
      CRON_AUDIENCE: https://mong-api.invalid
      CRON_SA_EMAIL: scheduler@local.invalid
      # B6a: 운영 필수 DB CA — 이 compose 전용 CA(위 certs). 실제 verify-full로 붙는다(규칙을 끄는 값이 아니다)
      DATABASE_CA_FILE: /tls/ca.crt
    volumes:
      - db-tls:/tls:ro
    ports: ['127.0.0.1:${MONG_API_PORT:-8080}:8080']
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

volumes:
  db-data:
  db-tls:
