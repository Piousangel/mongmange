- main:
  - heading "Press kit" [level=1]
  - paragraph: Materials for articles and features, in one place.
  - paragraph: One word in ink, twenty-eight nights.
  - paragraph: A mobile game about raising Mongmangi, a drop of ink on paper. Each day you write one word with a brush, and Mongmangi drinks the letters and answers with its body. It grows this way over twenty-eight nights.
