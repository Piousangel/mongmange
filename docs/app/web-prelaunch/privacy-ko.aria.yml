- main:
  - heading "출시 전 개인정보 안내" [level=1]
  - paragraph: 몽망이 키우기는 아직 출시 전이에요. 지금 이 사이트와 테스트 신청에서 다루는 개인정보를 적었어요.
  - region "지금 받는 것":
    - heading "지금 받는 것" [level=2]
    - paragraph: Android 비공개 테스트 신청 메일뿐이에요. 보내 주신 메일 주소와 메일 내용을 받아요.
  - region "쓰는 곳":
    - heading "쓰는 곳" [level=2]
    - paragraph: Google Play 비공개 테스트의 테스터 목록에 메일 주소를 등록하고, 테스트 안내를 보내는 데만 써요.
  - region "받는 길":
    - heading "받는 길" [level=2]
    - paragraph: hello@mongmang.ink로 보낸 메일은 운영자의 Gmail로 전달돼요. 우리 서버에는 저장하지 않아요.
  - region "지우는 때":
    - heading "지우는 때" [level=2]
    - paragraph: 정식 출시 30일 뒤에 받은 메일과 테스터 목록의 주소를 지워요. 그 전에 지워 달라고 하시면 바로 지워요.
  - region "이 사이트":
    - heading "이 사이트" [level=2]
    - paragraph: 쿠키, 분석 도구, 광고 추적을 쓰지 않아요. 페이지에는 실행되는 스크립트가 없어요.
  - region "문의":
    - heading "문의" [level=2]
    - paragraph: hello@mongmang.ink
  - region "앞으로":
    - heading "앞으로" [level=2]
    - paragraph: 앱을 출시할 때 앱 전체의 개인정보처리방침을 이 주소에 올려요.
