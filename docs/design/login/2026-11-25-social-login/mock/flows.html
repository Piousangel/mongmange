<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소셜 로그인 흐름 목업</title>
<!--
  몽망이 키우기 · 소셜 로그인 흐름 목업 (2026-11-25, 로그인·개인화 TF)
  사용: flows.html?s=R1 (화면 하나, 360×740) / flows.html?board=all (전부)
  화면 id: A1 A2 = 안 (가) 스플래시 직후 / B1 B2 = 안 (나) 첫 꿈 카드 아침 / R1 R2 R3 R4 = 안 (다) 팀 추천 / C1 = (다)의 공유 입구
  문구는 시안이다(V14·C14 문구 검수 전). 버튼 모양은 Apple HIG 'Sign in with Apple' 버튼 규칙(검정·같은 크기 이상)을 흉내만 낸다.
-->
<style>
  @font-face { font-family: "GB"; src: local("Gowun Batang"), url("../../../../../node_modules/@expo-google-fonts/gowun-batang/400Regular/GowunBatang_400Regular.ttf"); }
  @font-face { font-family: "GB"; font-weight: 700; src: local("Gowun Batang Bold"), url("../../../../../node_modules/@expo-google-fonts/gowun-batang/700Bold/GowunBatang_700Bold.ttf"); }
  :root {
    --paper: #EFE8DA; --paper2: #E3DACA; --ink: #1B1A18; --text: #2A2622; --sub: #6B625A;
    --wash: #B9B3A8; --seal: #C8462C; --line: #CFC5B3; --white: #FFFDF8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #cfc7b8; font-family: "GB", "AppleMyungjo", serif; color: var(--text); }
  body.single { background: var(--paper); }
  .board { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; }
  .group { display: flex; flex-direction: column; gap: 10px; }
  .group h2 { margin: 0; font-size: 18px; }
  .row { display: flex; gap: 16px; }
  .cap { font-size: 13px; color: var(--sub); max-width: 360px; }
  .scr { position: relative; width: 360px; height: 740px; overflow: hidden; background: var(--paper);
    background-image: radial-gradient(circle at 20% 10%, rgba(255,255,255,.35), transparent 40%),
      repeating-linear-gradient(17deg, rgba(120,100,70,.035) 0 1px, transparent 1px 7px);
  }
  .status { position: absolute; top: 10px; left: 20px; right: 20px; display: flex; justify-content: space-between; font: 12px -apple-system, sans-serif; color: var(--sub); }
  .seal { position: absolute; top: 34px; right: 22px; width: 34px; height: 34px; background: var(--seal); color: #fff; border-radius: 3px;
    display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .vtitle { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); writing-mode: vertical-rl; font-size: 19px; letter-spacing: 6px; color: var(--text); }
  .mong { position: absolute; left: 50%; transform: translateX(-50%); width: 92px; height: 72px; background: var(--ink); border-radius: 46% 54% 40% 42% / 60% 58% 42% 40%; }
  .mong::before, .mong::after { content: ""; position: absolute; top: 34px; width: 13px; height: 9px; background: #F4EFE4; border-radius: 50%; }
  .mong::before { left: 26px; } .mong::after { right: 26px; }
  .mong.small { width: 62px; height: 48px; } .mong.small::before, .mong.small::after { top: 22px; width: 9px; height: 6px; }
  .mong.small::before { left: 17px; } .mong.small::after { right: 17px; }
  .shadow { position: absolute; left: 50%; transform: translateX(-50%); width: 120px; height: 14px; border-radius: 50%; background: rgba(60,50,40,.13); filter: blur(3px); }
  .tools { position: absolute; bottom: 34px; left: 0; right: 0; display: flex; justify-content: space-around; font-size: 13px; color: var(--sub); }
  .dim::after { content: ""; position: absolute; inset: 0; background: rgba(27,26,24,.38); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--white); border-radius: 18px 18px 0 0; padding: 14px 22px 26px; z-index: 2; box-shadow: 0 -2px 18px rgba(0,0,0,.12); }
  .grab { width: 38px; height: 4px; background: var(--line); border-radius: 2px; margin: 0 auto 14px; }
  h3 { margin: 0 0 8px; font-size: 20px; font-weight: 700; color: var(--ink); line-height: 1.35; }
  p { margin: 0 0 10px; font-size: 14.5px; line-height: 1.6; }
  .small { font-size: 12.5px; color: var(--sub); line-height: 1.55; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 10px; font: 600 16px -apple-system, "Apple SD Gothic Neo", sans-serif; margin-top: 10px; }
  .apple { background: #000; color: #fff; }
  .apple b { font-size: 19px; font-weight: 500; margin-top: -3px; }
  .google { background: #fff; color: #1f1f1f; border: 1px solid #747775; }
  .g { font: 700 18px Arial, sans-serif; background: conic-gradient(#EA4335 0 25%, #FBBC05 0 50%, #34A853 0 75%, #4285F4 0); -webkit-background-clip: text; color: transparent; }
  .ghost { color: var(--sub); font-weight: 500; height: 44px; margin-top: 6px; }
  .inkbtn { background: var(--ink); color: var(--paper); font-family: "GB", serif; font-weight: 700; }
  .line { border: 1px solid var(--line); background: transparent; color: var(--text); font-family: "GB", serif; }
  .list { margin: 6px 0 12px; padding: 0; list-style: none; font-size: 14px; line-height: 1.55; }
  .list li { padding: 7px 0 7px 26px; position: relative; border-top: 1px dashed var(--line); }
  .list li:first-child { border-top: 0; }
  .list li::before { position: absolute; left: 2px; top: 6px; font-size: 15px; }
  .yes li::before { content: "○"; color: var(--ink); }
  .no li::before { content: "×"; color: var(--seal); }
  .card { position: absolute; left: 34px; right: 34px; background: #F7F2E8; border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 2px 10px rgba(80,60,30,.08); }
  .dream { height: 250px; overflow: hidden; }
  .dream svg { display: block; } .tpl { height: 100%; }
  .dream .lab { position: absolute; bottom: 10px; left: 14px; font-size: 13px; color: var(--sub); }
  .soft { position: absolute; left: 22px; right: 22px; background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .soft .t { font-size: 15.5px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
  .soft .d { font-size: 13px; color: var(--sub); line-height: 1.5; }
  .soft .acts { display: flex; gap: 8px; margin-top: 10px; }
  .soft .acts span { flex: 1; text-align: center; padding: 10px 0; border-radius: 8px; font-size: 14px; }
  .soft .acts .k { background: var(--ink); color: var(--paper); font-weight: 700; }
  .soft .acts .n { border: 1px solid var(--line); color: var(--sub); }
  .picker { display: flex; gap: 10px; margin: 12px 0 6px; }
  .picker div { flex: 1; border: 1px solid var(--line); border-radius: 10px; height: 120px; overflow: hidden; position: relative; background: #FBF8F1; }
  .picker div span { display: block; text-align: center; font-size: 15px; height: 30px; line-height: 30px; color: var(--wash); }
  .picker div span.on { color: var(--ink); font-weight: 700; background: var(--paper2); }
  .picker label { position: absolute; top: -1px; }
  .stamp { display: inline-flex; width: 64px; height: 64px; border: 2.5px solid var(--seal); color: var(--seal); border-radius: 6px; font-size: 22px; writing-mode: vertical-rl; align-items: center; justify-content: center; letter-spacing: 2px; font-weight: 700; }
  .field { border-bottom: 1.5px solid var(--ink); font-size: 22px; padding: 6px 2px; letter-spacing: 8px; width: 120px; }
  .row2 { display: flex; align-items: center; gap: 18px; margin: 10px 0 8px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 8px; }
  .chips span { border: 1px solid var(--line); border-radius: 14px; padding: 4px 10px; font-size: 12.5px; color: var(--sub); }
  .chips span.on { border-color: var(--ink); color: var(--ink); }
  .logo { position: absolute; top: 150px; left: 0; right: 0; text-align: center; font-size: 30px; font-weight: 700; letter-spacing: 4px; color: var(--ink); }
  .logo small { display: block; font-size: 13px; letter-spacing: 2px; color: var(--sub); font-weight: 400; margin-top: 8px; }
  .bottomstack { position: absolute; left: 24px; right: 24px; bottom: 40px; }
  .toggle { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px dashed var(--line); font-size: 14px; }
  .sw { width: 42px; height: 24px; border-radius: 12px; background: var(--wash); position: relative; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; }
  .sw.on { background: var(--ink); } .sw.on::after { left: 21px; }
</style>
</head>
<body>

<script>
const S = {
  /* ── 안 (가) 스플래시 직후 로그인 ───────────────────────── */
  A1: { cap: '(가) 첫 실행 — 스플래시 바로 다음. 로그인 전에 연령 확인부터 묻게 된다(14세 확인 → 계정 순서, D-23·처리방침 4절).', html: `

    <div class="logo">몽망이 키우기<small>먹 한 방울이 매일 밤 꿈을 꿔요</small></div>
    <div class="mong" style="top:300px"></div><div class="shadow" style="top:368px"></div>
    <div class="sheet"><div class="grab"></div>
      <h3>시작하기 전에, 태어난 해와 달을 알려 주세요</h3>
      <div class="picker"><div><span>2010</span><span>2011</span><span class="on">해 고르기</span><span>2012</span></div><div><span>3월</span><span>4월</span><span class="on">달 고르기</span><span>5월</span></div></div>
      <div class="btn inkbtn">다음</div>
      <div class="btn ghost">건너뛰기</div>
    </div>` },
  A2: { cap: '(가) 이어서 로그인 화면. 건너뛰기가 있지만 첫 화면 두 장이 모두 \'입력\'이다. 몽망이는 아직 한 번도 움직이지 않았다.', html: `
    <div class="status"><span>9:41</span><span>●●●</span></div>
    <div class="logo">몽망이 키우기<small>먹 한 방울이 매일 밤 꿈을 꿔요</small></div>
    <div class="mong" style="top:300px"></div><div class="shadow" style="top:368px"></div>
    <div class="bottomstack">
      <p style="text-align:center">로그인하면 기기를 바꿔도 이어 키울 수 있어요</p>
      <div class="btn apple"><svg width="18" height="18" viewBox="0 0 24 24" style="margin-top:-3px"><path fill="#fff" d="M16.37 12.5c-.02-2.1 1.72-3.12 1.8-3.17-.98-1.43-2.5-1.63-3.04-1.65-1.29-.13-2.52.76-3.18.76-.66 0-1.67-.74-2.75-.72-1.41.02-2.72.82-3.45 2.09-1.47 2.55-.38 6.33 1.06 8.4.7 1.01 1.53 2.15 2.62 2.11 1.05-.04 1.45-.68 2.72-.68 1.27 0 1.63.68 2.74.66 1.13-.02 1.85-1.03 2.54-2.05.8-1.17 1.13-2.31 1.15-2.37-.03-.01-2.2-.84-2.21-3.38zM14.3 6.3c.58-.7.97-1.68.86-2.65-.83.03-1.84.55-2.44 1.25-.53.62-1 1.62-.88 2.57.93.07 1.88-.47 2.46-1.17z"/></svg>Apple로 계속하기</div>
      <div class="btn google"><span class="g">G</span>Google로 계속하기</div>
      <div class="btn ghost">로그인 없이 시작</div>
    </div>` },

  /* ── 안 (나) 첫 꿈 카드를 받은 아침 ───────────────────────── */
  B1: { cap: '(나) 둘째 날 아침 — 처음 받은 꿈 카드 아래에 \'이 꿈을 간직하기\'. 유저가 쌓은 것은 밤 하나.', html: `
    <div class="status"><span>7:12</span><span>●●●</span></div>
    <div class="seal">몽</div>
    <div class="vtitle" style="top:58px">첫 번째 아침</div>
    <div class="card dream" style="top:250px"><div class="tpl"></div><div class="lab">간밤의 꿈 · 1</div></div>
    <div class="btn inkbtn" style="position:absolute;left:34px;right:34px;top:530px">이 꿈을 간직하기</div>
    <div class="btn ghost" style="position:absolute;left:34px;right:34px;top:584px">그냥 둘게요</div>
    <div class="tools"><span>먹 갈기</span><span>한 마디</span><span>재우기</span></div>` },
  B2: { cap: '(나) 누르면 — 연령 확인을 지난 뒤 로그인 시트. \'간직\'의 뜻이 로그인이어야 하는지 설명이 필요하다(꿈 카드는 이미 기기에 남는다).', html: `
    <div class="status"><span>7:12</span><span>●●●</span></div>
    <div class="vtitle" style="top:58px">첫 번째 아침</div>
    <div class="card dream" style="top:150px"><div class="tpl"></div></div>
    <div class="dim" style="position:absolute;inset:0"></div>
    <div class="sheet"><div class="grab"></div>
      <h3>이 꿈을 어디서든 다시 보려면</h3>
      <p class="small">꿈 카드는 이 기기에 이미 남아 있어요. 로그인하면 기기를 바꿔도 함께 옮겨 가요.</p>
      <div class="btn apple"><svg width="18" height="18" viewBox="0 0 24 24" style="margin-top:-3px"><path fill="#fff" d="M16.37 12.5c-.02-2.1 1.72-3.12 1.8-3.17-.98-1.43-2.5-1.63-3.04-1.65-1.29-.13-2.52.76-3.18.76-.66 0-1.67-.74-2.75-.72-1.41.02-2.72.82-3.45 2.09-1.47 2.55-.38 6.33 1.06 8.4.7 1.01 1.53 2.15 2.62 2.11 1.05-.04 1.45-.68 2.72-.68 1.27 0 1.63.68 2.74.66 1.13-.02 1.85-1.03 2.54-2.05.8-1.17 1.13-2.31 1.15-2.37-.03-.01-2.2-.84-2.21-3.38zM14.3 6.3c.58-.7.97-1.68.86-2.65-.83.03-1.84.55-2.44 1.25-.53.62-1 1.62-.88 2.57.93.07 1.88-.47 2.46-1.17z"/></svg>Apple로 계속하기</div>
      <div class="btn google"><span class="g">G</span>Google로 계속하기</div>
      <div class="btn ghost">나중에</div>
    </div>` },

  /* ── 안 (다) 팀 추천: 지킬 것이 생긴 순간 ───────────────────────── */
  R1: { cap: '(다) 입구 ① — 7번째 아침, 이레 한 폭을 받은 뒤 한 번만 뜨는 조용한 카드. 닫으면 다시 묻지 않는다. 다른 입구: 공유 미리보기의 \'서명\', 공방 노트 \'맡겨 두기\'.', html: `
    <div class="status"><span>7:20</span><span>●●●</span></div>
    <div class="seal">몽</div>
    <div class="vtitle" style="top:52px">일곱 밤 · 이레</div>
    <div class="card" style="top:236px;height:190px;overflow:hidden"><div class="tpl" style="height:100%"></div>
      <div style="position:absolute;right:10px;bottom:8px;font-size:12px;color:var(--sub)">이레 한 폭 · 1</div></div>
    <div class="soft" style="top:450px">
      <div class="t">일곱 밤의 꿈이 한 폭이 되었어요</div>
      <div class="d">휴대폰을 바꾸거나 앱을 지워도 이 아이를 다시 만날 수 있게 지켜 둘까요? 로그인 한 번이면 돼요.</div>
      <div class="acts"><span class="k">지켜 두기</span><span class="n">괜찮아요</span></div><div class="d" style="margin-top:6px;font-size:11.5px">지켜 두기 = 기기 바꿔도 이어 키우기 · 공방 노트에서도 켤 수 있어요</div>
    </div>
    <div class="tools"><span>먹 갈기</span><span>한 마디</span><span>재우기</span></div>` },
  R2: { cap: '(다) ② 연령 확인 — 지금 C12에 있는 화면 그대로(태어난 해·달, 저장 0, 기준 숫자 안 보임). 계정이 생기기 직전 한 번.', html: `
    <div class="status"><span>7:20</span><span>●●●</span></div>
    <div class="vtitle" style="top:52px">일곱 밤 · 이레</div>
    <div class="mong" style="top:330px"></div><div class="shadow" style="top:398px"></div>
    <div class="dim" style="position:absolute;inset:0"></div>
    <div class="sheet"><div class="grab"></div>
      <h3>태어난 해와 달을 골라 주세요</h3>
      <p class="small">지켜 두기는 나이를 한 번 확인한 뒤에 켤 수 있어요. 고른 해와 달은 어디에도 저장하지 않아요.</p>
      <div class="picker"><div><span>2009</span><span>2010</span><span class="on">해 고르기</span><span>2011</span></div><div><span>3월</span><span>4월</span><span class="on">달 고르기</span><span>5월</span></div></div>
      <div class="btn inkbtn">확인</div>
    </div>` },
  R3: { cap: '(다) ③ 무엇을 받는지 먼저 보이고 고르게 한다. iOS는 Apple을 위에(4.8, HIG 같은 크기 이상), Android는 Google을 위에. 로그인 없이 \'되찾기 글귀\'로만 맡기는 길도 남긴다.', html: `
    <div class="status"><span>7:20</span><span>●●●</span></div>
    <div class="vtitle" style="top:52px">일곱 밤 · 이레</div>
    <div class="dim" style="position:absolute;inset:0"></div>
    <div class="sheet"><div class="grab"></div>
      <h3>이 아이를 지켜 둘게요</h3><p class="small" style="margin-top:-4px">지켜 두기 = 기기를 바꾸거나 앱을 지워도 이어 키우기</p>
      <p class="small">고른 계정으로 로그인하면, 새 기기에서도 같은 계정으로 몽망이를 다시 데려와요.</p>
      <ul class="list yes"><li>받는 것 — 계정을 다시 알아볼 번호 하나(알아볼 수 없게 바꿔서 보관)</li><li>맡기는 것 — 몽망이 기록. <b>밤마다 쓴 한 마디의 글자는 올리지 않아요</b>(몸에 붙은 한 획 모양만)</li></ul>

  R4: { cap: '(다) ④ 끝 — 지켜졌다는 확인만. [블라인드 피드백 반영] 호(號)·인장 정하기는 로그인 흐름에서 빼고 첫 공유(C1)에서 묻는다.', html: `
    <div class="status"><span>7:21</span><span>●●●</span></div>

const GROUPS = [
  ['ga', '안 (가) 스플래시 직후', ['A1', 'A2']],
  ['na', '안 (나) 첫 꿈 카드 아침', ['B1', 'B2']],
  ['da', '안 (다) 지킬 것이 생긴 순간 — 팀 추천', ['R1', 'R2', 'R3', 'R4', 'C1']],
];

function screen(id) {
  const d = document.createElement('div');
  d.className = 'scr'; d.id = 'scr-' + id; d.innerHTML = S[id].html;
  d.querySelectorAll('.tpl').forEach(t => t.appendChild(document.getElementById('dreamsvg').content.cloneNode(true)));
  return d;
}
const q = new URLSearchParams(location.search);
const root = document.getElementById('root');
if (q.get('s')) { document.body.className = 'single'; root.appendChild(screen(q.get('s'))); }
else {
  const want = q.get('board') || 'all';
  const b = document.createElement('div'); b.className = 'board';
  for (const [key, title, ids] of GROUPS) {
    if (want !== 'all' && want !== key) continue;
    const g = document.createElement('div'); g.className = 'group';
    g.innerHTML = `<h2>${q.get('blind') ? '' : title}</h2>`;
    const r = document.createElement('div'); r.className = 'row';
    for (const id of ids) { const c = document.createElement('div'); c.appendChild(screen(id)); if (!q.get('blind')) { const p = document.createElement('div'); p.className = 'cap'; p.textContent = id + ' · ' + S[id].cap; c.appendChild(p); } r.appendChild(c); }
    g.appendChild(r); b.appendChild(g);
  }
  root.appendChild(b);
}
</script>
