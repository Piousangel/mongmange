<html><head><meta charset="utf-8"><style>body{margin:0;background:#EFE8DA}canvas{display:block}</style></head><body><canvas id="c"></canvas><script>
const Q = new URLSearchParams(location.search), S = Q.get('s') || 'body';
const PAPER = '#EFE8DA', INK = '#1E1B18', GOLD = '#B8944A', GS = 'rgba(214,180,104,', RED = '#B0432E';

// ── 유저 글씨에서 한 획 떼어 내기(나눔손글씨 붓 글리프의 오른쪽 ㅣ 또는 아래 ㅡ 덩어리) ──
const GLY = {};
function glyphStroke(ch, part) {

  const col = (x) => { for (let y = 0; y < 300; y++) if (on(x, y)) return true; return false; };
  const row = (y) => { for (let x = 0; x < 300; x++) if (on(x, y)) return true; return false; };
  let x0 = 0, x1 = 299, y0 = 0, y1 = 299;

  else { y1 = 299; while (y1 > 0 && !row(y1)) y1--; y0 = y1; while (y0 > 0 && row(y0)) y0--; }

const tintC = new Map();

// 네 이레의 획(이레마다 유저가 고른 글씨의 한 획)
const WEEKS = [['비', 'right'], ['으', 'bottom'], ['이', 'right'], ['니', 'right']];
// 몸 자리(몸 좌표: 바닥 가운데 원점, W 몸 너비) — 보강안: 획 몸통은 몸 속(밝은 윤 먹), 꼬리는 몸 밖 종이 위(담묵)
const SLOT = [{ x: -.45, y: -.3, len: .44, ang: -1.25 }, { x: .3, y: -.07, len: .32, ang: -.12 }, { x: -.2, y: -.62, len: .38, ang: -.3 }, { x: .47, y: -.17, len: .26, ang: -1.45 }];
const IN_INK = '#9d9283';

  const strokesAt = (clipInside, color) => { for (let k = 0; k < strokes; k++) { const s = SLOT[k], st = glyphStroke(...WEEKS[k]); g.save(); if (k === fresh && wet) putStroke(g, st, s.x * W, s.y * W, s.len * W * 1.04, s.ang, GOLD, .7 * wet, 1.5); putStroke(g, st, s.x * W, s.y * W, s.len * W, s.ang, clipInside ? (k === fresh && wet ? mix(IN_INK, '#E9D3A0', wet * .6) : IN_INK) : STROKE_INK, 1, 1.0); g.restore(); } };

// 인장판: 몸 오른쪽 아래 낙관 자리, 2×2 칸, 인주 테두리, 칸마다 그 이레의 한 획(인주)

// ── 꿈 바탕(마블링 띠 + 흰 물길) ──

  g.save(); g.globalAlpha = .55; g.strokeStyle = '#F7F3EA'; g.lineCap = 'round'; for (let k = 0; k < 2; k++) { g.lineWidth = k ? 6 : 16; g.globalAlpha = k ? .8 : .35; g.beginPath(); for (let t = 0; t <= 1.001; t += .02) { const x = W * (.62 - .25 * Math.sin(t * 3.4 + .6) * (1 - t * .3)), y = H * (.02 + t * .8); t ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); } g.restore();

// ── 프레임 ──
const FW = 300, FH = 375, GAP = 14, PAD = 16, LBL = 26;

// 덧말
const IMG = {}; const PIECE_DIR = '../../../dream/2026-11-25-dream-compose-v2/prototype/pieces/';
